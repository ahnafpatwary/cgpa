<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BRACU CGPA Calculator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318181c' stroke='rgba(255,255,255,0.08)' stroke-width='1'/%3E%3Ctext x='32' y='30' font-family='sans-serif' font-weight='900' font-size='22' fill='white' text-anchor='middle'%3ECG%3C/text%3E%3Ctext x='32' y='52' font-family='sans-serif' font-weight='900' font-size='22' fill='%237c6af7' text-anchor='middle'%3EPA%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e10;
  --surface: #18181c;
  --surface2: #222228;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.18);
  --text: #f0f0f2;
  --text-muted: #888;
  --text-dim: #4a4a55;
  --accent: #7c6af7;
  --accent-soft: rgba(124,106,247,0.15);
  --danger: #f25757;
  --danger-soft: rgba(242,87,87,0.18);
  --font: 'DM Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  min-height: 100vh;
  padding: 2.5rem 1.5rem 5rem;
}

.app { max-width: 900px; margin: 0 auto; }

/* ── Header ── */
.header { margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.logo { font-size: 0.72rem; letter-spacing: 0.16em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 0.4rem; }
.header h1 { font-size: 1.75rem; font-weight: 600; }
.header h1 span { color: var(--accent); }

/* ── Stats ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 1.5rem;
}
.stat { background: var(--surface); padding: 1rem 1.25rem; }
.stat-label { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.35rem; }
.stat-value { font-size: 1.55rem; font-weight: 600; }
.stat-value.accent { color: var(--accent); }

/* ── Graph ── */
.graph-section { margin-bottom: 2rem; }
.graph-toggle {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: none; border: 1px solid var(--border);
  color: var(--text-muted); font-family: var(--font); font-size: 0.8rem;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.graph-toggle:hover { border-color: var(--accent); color: var(--accent); }
.graph-wrap { margin-top: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; display: none; }
.graph-wrap.visible { display: block; }

/* ── Semesters ── */
.semesters { display: flex; flex-direction: column; gap: 1.25rem; }
.semester-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color 0.2s; }
.semester-card:hover { border-color: var(--border-hover); }

.semester-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.9rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  gap: 1rem;
}
.sem-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 0; }
.sem-num { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--text-dim); white-space: nowrap; text-transform: uppercase; }

.sem-name-input {
  background: none; border: none; outline: none;
  color: var(--text); font-family: var(--font); font-size: 1rem; font-weight: 500;
  width: 100%; border-bottom: 1px solid transparent;
  transition: border-color 0.2s; padding-bottom: 1px;
}
.sem-name-input:focus { border-bottom-color: var(--accent); }

.sem-gpa-badge {
  font-size: 0.82rem; font-weight: 500;
  background: var(--accent-soft); color: var(--accent);
  padding: 0.28rem 0.7rem; border-radius: 5px; white-space: nowrap; flex-shrink: 0;
}

.sem-delete-btn {
  background: var(--danger-soft);
  border: 1px solid rgba(242,87,87,0.45);
  color: var(--danger);
  cursor: pointer; padding: 6px 10px; border-radius: 6px;
  display: flex; align-items: center; flex-shrink: 0;
  transition: background 0.2s;
}
.sem-delete-btn:hover { background: rgba(242,87,87,0.32); }

/* ── Course table ── */
.course-table { width: 100%; border-collapse: collapse; }
.course-table thead tr { border-bottom: 1px solid var(--border); }
.course-table th {
  font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-dim); font-weight: 500;
  padding: 0.65rem 1rem; text-align: left;
}
.course-table td { padding: 0.55rem 1rem; vertical-align: middle; }
.course-table tbody tr { border-bottom: 1px solid var(--border); }
.course-table tbody tr:last-child { border-bottom: none; }
.course-table tbody tr:hover { background: rgba(255,255,255,0.02); }

/* Cell inputs — outlined so they feel editable */
.cell-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 0.92rem;
  padding: 0.35rem 0.6rem;
  width: 100%;
  transition: border-color 0.2s;
}
.cell-input:focus { border-color: var(--accent); }
.cell-input::placeholder { color: var(--text-dim); }
/* prevent number spinners shrinking the font */
.cell-input[type="number"] { font-size: 0.92rem; }

.gpa-select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font); font-size: 0.92rem;
  padding: 0.35rem 0.5rem; border-radius: 6px;
  cursor: pointer; outline: none;
  transition: border-color 0.2s;
  width: 80px; text-align: center;
  -webkit-appearance: none; appearance: none;
}
.gpa-select:focus { border-color: var(--accent); }

.letter-badge {
  font-size: 0.82rem; font-weight: 500;
  color: var(--text-muted); display: block; text-align: center;
}

.row-delete-btn {
  background: var(--danger-soft);
  border: 1px solid rgba(242,87,87,0.4);
  color: var(--danger);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 5px 8px; border-radius: 5px; margin: 0 auto;
  transition: background 0.2s;
}
.row-delete-btn:hover { background: rgba(242,87,87,0.32); }

/* ── Add course / semester ── */
.add-course-row { padding: 0.65rem 1rem; border-top: 1px solid var(--border); }
.add-course-btn {
  background: none; border: 1px dashed var(--border);
  color: var(--text-dim); font-family: var(--font); font-size: 0.82rem;
  padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; width: 100%;
  transition: border-color 0.2s, color 0.2s;
}
.add-course-btn:hover { border-color: var(--accent); color: var(--accent); }

.add-semester-wrap { margin-top: 1.25rem; }
.add-semester-btn {
  background: none; border: 1px dashed var(--border-hover);
  color: var(--text-muted); font-family: var(--font); font-size: 0.88rem;
  padding: 1rem; border-radius: 12px; cursor: pointer; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.add-semester-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ── Semester footer ── */
.sem-footer {
  display: flex; gap: 2rem; flex-wrap: wrap;
  padding: 0.6rem 1.25rem;
  background: rgba(124,106,247,0.04);
  border-top: 1px solid var(--border);
  font-size: 0.78rem; color: var(--text-dim);
}
.sem-footer .val { color: var(--accent); font-weight: 500; }

/* ── Empty state ── */
.empty-state { padding: 2.5rem 1rem; text-align: center; color: var(--text-dim); font-size: 0.88rem; }

/* ── Footer ── */
.site-footer {
  margin-top: 4rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.footer-left { display: flex; align-items: center; gap: 0.65rem; }
.footer-icon { width: 28px; height: 28px; flex-shrink: 0; }
.footer-name { font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
.footer-right { font-size: 0.78rem; color: var(--text-dim); text-align: right; }

/* ── Modal ── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.78);
  display: none; align-items: center; justify-content: center;
  z-index: 999; padding: 1rem;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border-hover);
  border-radius: 14px; padding: 1.75rem;
  max-width: 360px; width: 100%;
}
.modal h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; }
.modal p { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }
.modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
.btn-cancel {
  background: none; border: 1px solid var(--border-hover);
  color: var(--text-muted); font-family: var(--font); font-size: 0.88rem;
  padding: 0.55rem 1.1rem; border-radius: 7px; cursor: pointer;
  transition: border-color 0.2s;
}
.btn-cancel:hover { border-color: var(--text-muted); }
.btn-proceed {
  background: var(--danger-soft); border: 1px solid rgba(242,87,87,0.4);
  color: var(--danger); font-family: var(--font); font-size: 0.88rem;
  padding: 0.55rem 1.1rem; border-radius: 7px; cursor: pointer;
  transition: background 0.2s;
}
.btn-proceed:hover { background: rgba(242,87,87,0.3); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">BRACU</div>
    <h1>CGPA <span>Calculator</span></h1>
    <div class="stats-row">
      <div class="stat"><div class="stat-label">Overall CGPA</div><div class="stat-value accent" id="stat-cgpa">—</div></div>
      <div class="stat"><div class="stat-label">Total Credits</div><div class="stat-value" id="stat-credits">0</div></div>
      <div class="stat"><div class="stat-label">Semesters</div><div class="stat-value" id="stat-sems">0</div></div>
      <div class="stat"><div class="stat-label">Courses</div><div class="stat-value" id="stat-courses">0</div></div>
    </div>
  </div>

  <div class="graph-section">
    <button class="graph-toggle" id="graph-btn">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1,12 5,7 8,10 11,5 15,3"/></svg>
      Show CGPA Trend
    </button>
    <div class="graph-wrap" id="graph-wrap">
      <div style="position:relative;height:220px;">
        <canvas id="cgpa-chart" role="img" aria-label="Cumulative CGPA trend over semesters">No data yet.</canvas>
      </div>
    </div>
  </div>

  <div class="semesters" id="semesters-container">
    <div class="empty-state">No semesters yet. Add your first one below.</div>
  </div>

  <div class="add-semester-wrap">
    <button class="add-semester-btn" id="add-sem-btn">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="7.5" y1="1" x2="7.5" y2="14"/><line x1="1" y1="7.5" x2="14" y2="7.5"/></svg>
      Add Semester
    </button>
  </div>

  <footer class="site-footer">
    <div class="footer-left">
      <svg class="footer-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#18181c" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="32" y="30" font-family="sans-serif" font-weight="900" font-size="22" fill="white" text-anchor="middle">CG</text>
        <text x="32" y="52" font-family="sans-serif" font-weight="900" font-size="22" fill="#7c6af7" text-anchor="middle">PA</text>
      </svg>
      <span class="footer-name">BRACU CGPA Calculator</span>
    </div>
    <div class="footer-right">
      &copy; <script>document.write(new Date().getFullYear())</script> Ahnaf Tahmid Patwary. All rights reserved.
    </div>
  </footer>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">Confirm deletion</h3>
    <p id="modal-body">This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-proceed" id="modal-confirm">Delete</button>
    </div>
  </div>
</div>

<script>
(function () {
  var GPA_OPTIONS = [4.0, 3.7, 3.3, 3.0, 2.7, 2.3, 2.0, 1.7, 1.3, 1.0, 0.7, 0.0];
  var GRADE_MAP = {
    '4.0':'A/A+','3.7':'A-','3.3':'B+','3.0':'B',
    '2.7':'B-','2.3':'C+','2.0':'C','1.7':'C-',
    '1.3':'D+','1.0':'D','0.7':'D-','0.0':'F'
  };
  var STORAGE_KEY = 'bracu_cgpa_v4';

  var state = { semesters: [] };
  var graphVisible = false;
  var chartInstance = null;

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function fmt(v) { return (v !== null && v !== undefined) ? v.toFixed(3) : '—'; }
  function gpaToGrade(gpa) { return GRADE_MAP[parseFloat(gpa).toFixed(1)] || '—'; }

  function load() {
    try { var s = localStorage.getItem(STORAGE_KEY); if (s) state = JSON.parse(s); } catch(e) {}
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  /* ── Calculations ── */
  function calcSemGPA(sem) {
    var valid = sem.courses.filter(function(c){ return parseFloat(c.credits) > 0; });
    if (!valid.length) return null;
    var wSum = valid.reduce(function(s,c){ return s + c.gpa * parseFloat(c.credits); }, 0);
    var cSum = valid.reduce(function(s,c){ return s + parseFloat(c.credits); }, 0);
    return cSum > 0 ? wSum / cSum : null;
  }

  function calcCGPAAfter(index) {
    var wSum = 0, cSum = 0;
    for (var i = 0; i <= index; i++) {
      state.semesters[i].courses.forEach(function(c) {
        var cr = parseFloat(c.credits) || 0;
        if (cr > 0) { wSum += c.gpa * cr; cSum += cr; }
      });
    }
    return cSum > 0 ? wSum / cSum : null;
  }

  function calcOverall() {
    if (!state.semesters.length) return null;
    return calcCGPAAfter(state.semesters.length - 1);
  }

  /* ── Modal — key fix: store pending callback in a closure var, never re-clone ── */
  var pendingCb = null;

  document.getElementById('modal-confirm').addEventListener('click', function() {
    document.getElementById('modal').classList.remove('open');
    if (pendingCb) { var cb = pendingCb; pendingCb = null; cb(); }
  });
  document.getElementById('modal-cancel').addEventListener('click', function() {
    document.getElementById('modal').classList.remove('open');
    pendingCb = null;
  });
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) { this.classList.remove('open'); pendingCb = null; }
  });

  function openModal(title, body, cb) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').textContent = body;
    pendingCb = cb;
    document.getElementById('modal').classList.add('open');
  }

  /* ── Graph ── */
  document.getElementById('graph-btn').addEventListener('click', function() {
    graphVisible = !graphVisible;
    document.getElementById('graph-wrap').classList.toggle('visible', graphVisible);
    this.innerHTML =
      '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1,12 5,7 8,10 11,5 15,3"/></svg> ' +
      (graphVisible ? 'Hide' : 'Show') + ' CGPA Trend';
    if (graphVisible) renderGraph();
  });

  function renderGraph() {
    var labels = [], data = [];
    state.semesters.forEach(function(sem, i) {
      var val = calcCGPAAfter(i);
      if (val !== null) { labels.push(sem.name || 'Sem '+(i+1)); data.push(parseFloat(val.toFixed(3))); }
    });
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    if (!labels.length) return;
    var ctx = document.getElementById('cgpa-chart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: [{
        label: 'CGPA', data: data,
        borderColor: '#7c6af7', backgroundColor: 'rgba(124,106,247,0.08)',
        borderWidth: 2, pointBackgroundColor: '#7c6af7',
        pointRadius: 5, pointHoverRadius: 7, fill: true, tension: 0.3
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#222228', borderColor: 'rgba(124,106,247,0.4)', borderWidth: 1,
            titleColor: '#888', bodyColor: '#f0f0f2',
            callbacks: { label: function(c){ return ' CGPA: '+c.parsed.y.toFixed(3); } }
          }
        },
        scales: {
          x: { grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#555'}, border:{color:'rgba(255,255,255,0.07)'} },
          y: { min:0, max:4.0, grid:{color:'rgba(255,255,255,0.04)'},
               ticks:{color:'#555', stepSize:0.5, callback:function(v){return v.toFixed(1);}},
               border:{color:'rgba(255,255,255,0.07)'} }
        }
      }
    });
  }

  /* ── Stats ── */
  function updateStats() {
    var cgpa = calcOverall();
    document.getElementById('stat-cgpa').textContent = cgpa !== null ? cgpa.toFixed(3) : '—';
    var totalCr = state.semesters.reduce(function(s,sem){
      return s + sem.courses.reduce(function(ss,c){ return ss+(parseFloat(c.credits)||0); },0);
    },0);
    document.getElementById('stat-credits').textContent = totalCr;
    document.getElementById('stat-sems').textContent = state.semesters.length;
    document.getElementById('stat-courses').textContent =
      state.semesters.reduce(function(s,sem){ return s+sem.courses.length; },0);
  }

  /* ── Actions ── */
  document.getElementById('add-sem-btn').addEventListener('click', function() {
    state.semesters.push({ id:uid(), name:'Semester '+(state.semesters.length+1), courses:[] });
    save(); render();
  });

  function deleteSemester(semId) {
    openModal('Delete semester?', 'All courses in this semester will be permanently removed.', function() {
      state.semesters = state.semesters.filter(function(s){ return s.id !== semId; });
      save(); render();
    });
  }

  function addCourse(semId) {
    var sem = state.semesters.find(function(s){ return s.id === semId; });
    if (!sem) return;
    sem.courses.push({ id:uid(), name:'', credits:3, gpa:4.0 });
    save(); render();
  }

  function deleteCourse(semId, courseId) {
    openModal('Delete course?', 'This course will be removed from the semester.', function() {
      var sem = state.semesters.find(function(s){ return s.id === semId; });
      if (!sem) return;
      sem.courses = sem.courses.filter(function(c){ return c.id !== courseId; });
      save(); render();
    });
  }

  function onSemNameChange(semId, val) {
    var sem = state.semesters.find(function(s){ return s.id === semId; });
    if (!sem) return;
    sem.name = val; save(); updateStats();
    if (graphVisible) renderGraph();
  }

  function onCourseChange(semId, courseId, field, val) {
    var sem = state.semesters.find(function(s){ return s.id === semId; });
    if (!sem) return;
    var c = sem.courses.find(function(c){ return c.id === courseId; });
    if (!c) return;
    if (field === 'credits') c.credits = parseFloat(val) || 0;
    else if (field === 'gpa') c.gpa = parseFloat(val);
    else c[field] = val;
    save();
    var gradeEl = document.getElementById('grade-'+courseId);
    if (gradeEl) gradeEl.textContent = gpaToGrade(c.gpa);
    var idx = state.semesters.findIndex(function(s){ return s.id === semId; });
    refreshFooters(idx);
    updateStats();
    if (graphVisible) renderGraph();
  }

  function refreshFooters(fromIdx) {
    for (var i = fromIdx; i < state.semesters.length; i++) {
      var sem = state.semesters[i];
      var semGPA = calcSemGPA(sem);
      var cgpa = calcCGPAAfter(i);
      var badge = document.getElementById('badge-'+sem.id);
      var fGPA  = document.getElementById('footer-gpa-'+sem.id);
      var fCGPA = document.getElementById('footer-cgpa-'+sem.id);
      if (badge) badge.textContent = 'GPA '+fmt(semGPA);
      if (fGPA)  fGPA.innerHTML  = 'Semester GPA: <span class="val">'+fmt(semGPA)+'</span>';
      if (fCGPA) fCGPA.innerHTML = 'CGPA after this semester: <span class="val">'+fmt(cgpa)+'</span>';
    }
  }

  /* ── DOM builders ── */
  function buildCourseRow(sem, c) {
    var tr = document.createElement('tr');

    /* Course name */
    var tdName = document.createElement('td');
    var nameInput = document.createElement('input');
    nameInput.className = 'cell-input';
    nameInput.type = 'text';
    nameInput.placeholder = 'e.g. MAT110';
    nameInput.value = c.name;
    (function(sid,cid){
      nameInput.addEventListener('change', function(){ onCourseChange(sid,cid,'name',this.value); });
      nameInput.addEventListener('keydown', function(e){ if(e.key==='Enter') this.blur(); });
    })(sem.id, c.id);
    tdName.appendChild(nameInput);
    tr.appendChild(tdName);

    /* Credits */
    var tdCr = document.createElement('td');
    tdCr.style.width = '110px';
    var crInput = document.createElement('input');
    crInput.className = 'cell-input';
    crInput.type = 'number';
    crInput.min = '0'; crInput.max = '9'; crInput.step = '0.5';
    crInput.value = c.credits;
    crInput.style.width = '80px';
    (function(sid,cid){
      crInput.addEventListener('change', function(){ onCourseChange(sid,cid,'credits',this.value); });
      crInput.addEventListener('keydown', function(e){ if(e.key==='Enter') this.blur(); });
    })(sem.id, c.id);
    tdCr.appendChild(crInput);
    tr.appendChild(tdCr);

    /* GPA select */
    var tdGPA = document.createElement('td');
    tdGPA.style.width = '100px';
    var sel = document.createElement('select');
    sel.className = 'gpa-select';
    GPA_OPTIONS.forEach(function(g){
      var opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g.toFixed(2);
      if (Math.abs(c.gpa - g) < 0.001) opt.selected = true;
      sel.appendChild(opt);
    });
    (function(sid,cid){
      sel.addEventListener('change', function(){ onCourseChange(sid,cid,'gpa',this.value); });
    })(sem.id, c.id);
    tdGPA.appendChild(sel);
    tr.appendChild(tdGPA);

    /* Letter grade */
    var tdGrade = document.createElement('td');
    tdGrade.style.width = '72px';
    var badge = document.createElement('span');
    badge.className = 'letter-badge';
    badge.id = 'grade-'+c.id;
    badge.textContent = gpaToGrade(c.gpa);
    tdGrade.appendChild(badge);
    tr.appendChild(tdGrade);

    /* Delete */
    var tdDel = document.createElement('td');
    tdDel.style.width = '58px';
    tdDel.style.textAlign = 'center';
    var delBtn = document.createElement('button');
    delBtn.className = 'row-delete-btn';
    delBtn.title = 'Remove course';
    delBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg>';
    (function(sid,cid){
      delBtn.addEventListener('click', function(){ deleteCourse(sid,cid); });
    })(sem.id, c.id);
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);

    return tr;
  }

  function buildSemesterCard(sem, index) {
    var semGPA    = calcSemGPA(sem);
    var cgpaAfter = calcCGPAAfter(index);

    var card = document.createElement('div');
    card.className = 'semester-card';

    /* Header */
    var header = document.createElement('div');
    header.className = 'semester-header';

    var semLeft = document.createElement('div');
    semLeft.className = 'sem-left';

    var numSpan = document.createElement('span');
    numSpan.className = 'sem-num';
    numSpan.textContent = 'SEM '+String(index+1).padStart(2,'0');
    semLeft.appendChild(numSpan);

    var nameInput = document.createElement('input');
    nameInput.className = 'sem-name-input';
    nameInput.type = 'text';
    nameInput.value = sem.name;
    (function(sid){
      nameInput.addEventListener('change', function(){ onSemNameChange(sid, this.value); });
      nameInput.addEventListener('keydown', function(e){ if(e.key==='Enter') this.blur(); });
    })(sem.id);
    semLeft.appendChild(nameInput);
    header.appendChild(semLeft);

    var gpaBadge = document.createElement('span');
    gpaBadge.className = 'sem-gpa-badge';
    gpaBadge.id = 'badge-'+sem.id;
    gpaBadge.textContent = 'GPA '+fmt(semGPA);
    header.appendChild(gpaBadge);

    var semDelBtn = document.createElement('button');
    semDelBtn.className = 'sem-delete-btn';
    semDelBtn.title = 'Delete semester';
    semDelBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="3,4 4,13 11,13 12,4"/><line x1="1.5" y1="4" x2="13.5" y2="4"/><line x1="5.5" y1="2" x2="5.5" y2="4"/><line x1="9.5" y1="2" x2="9.5" y2="4"/><line x1="4.5" y1="2" x2="10.5" y2="2"/></svg>';
    (function(sid){
      semDelBtn.addEventListener('click', function(){ deleteSemester(sid); });
    })(sem.id);
    header.appendChild(semDelBtn);
    card.appendChild(header);

    /* Course table */
    if (sem.courses.length > 0) {
      var table = document.createElement('table');
      table.className = 'course-table';
      var thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Course</th><th>Credits</th><th>GPA</th><th style="text-align:center">Grade</th><th></th></tr>';
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      sem.courses.forEach(function(c){ tbody.appendChild(buildCourseRow(sem, c)); });
      table.appendChild(tbody);
      card.appendChild(table);
    } else {
      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'empty-state';
      emptyDiv.textContent = 'No courses yet.';
      card.appendChild(emptyDiv);
    }

    /* Add course */
    var addRow = document.createElement('div');
    addRow.className = 'add-course-row';
    var addBtn = document.createElement('button');
    addBtn.className = 'add-course-btn';
    addBtn.textContent = '+ Add Course';
    (function(sid){ addBtn.addEventListener('click', function(){ addCourse(sid); }); })(sem.id);
    addRow.appendChild(addBtn);
    card.appendChild(addRow);

    /* Footer */
    var footer = document.createElement('div');
    footer.className = 'sem-footer';
    var fGPA = document.createElement('div');
    fGPA.id = 'footer-gpa-'+sem.id;
    fGPA.innerHTML = 'Semester GPA: <span class="val">'+fmt(semGPA)+'</span>';
    var fCGPA = document.createElement('div');
    fCGPA.id = 'footer-cgpa-'+sem.id;
    fCGPA.innerHTML = 'CGPA after this semester: <span class="val">'+fmt(cgpaAfter)+'</span>';
    footer.appendChild(fGPA);
    footer.appendChild(fCGPA);
    card.appendChild(footer);

    return card;
  }

  function render() {
    var container = document.getElementById('semesters-container');
    container.innerHTML = '';
    if (!state.semesters.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No semesters yet. Add your first one below.';
      container.appendChild(empty);
    } else {
      state.semesters.forEach(function(sem, i){ container.appendChild(buildSemesterCard(sem, i)); });
    }
    updateStats();
    if (graphVisible) renderGraph();
  }

  load();
  render();
})();
</script>
</body>
</html>
